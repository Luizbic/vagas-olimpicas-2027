name: Monitorar Vagas Olímpicas 2027
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Executar monitor
        id: monitor
        shell: bash
        run: |
          set +e
          python monitor.py
          code=$?
          if [ "$code" -eq 10 ]; then echo 'novidade=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$code"
      - name: Commitar status atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.json status.previous.json
          git diff --cached --quiet || git commit -m 'Atualiza monitoramento de vagas olímpicas 2027'
          git push
      - name: Criar label de alerta
        if: steps.monitor.outputs.novidade == 'true'
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: gh label create 'vagas-olimpicas-2027' --color '22c55e' --description 'Alerta do monitor de vagas olímpicas' --force
      - name: Criar Issue de alerta
        if: steps.monitor.outputs.novidade == 'true'
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          if [ "$(gh issue list --state open --label 'vagas-olimpicas-2027' --json number --jq 'length')" -gt 0 ]; then exit 0; fi
          gh issue create --title '🚨 Novidade detectada: Vagas Olímpicas 2027' --label 'vagas-olimpicas-2027' --body "O monitor detectou uma novidade. Consulte o dashboard: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/\n\nOs links de edital e inscrição, quando encontrados, estão no status.json e no dashboard. Verificado em: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
