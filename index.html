<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vagas Olímpicas 2027</title><style>:root{color-scheme:dark;--bg:#090d16;--panel:#121a29;--text:#edf2f7;--muted:#a7b3c6;--green:#22c55e;--red:#7f1d1d;--line:#26344a}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at top,#16233b,var(--bg) 45%);min-height:100vh}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:48px 0}h1{margin-bottom:8px}.subtitle,.updated,.forecast{color:var(--muted)}.updated{margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:14px;padding:20px;background:rgba(18,26,41,.9)}.card h2{font-size:1.15rem;margin:0 0 10px}.badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:700}.new{background:var(--green);color:#052e16}.waiting{background:var(--red);color:#fecaca}a{color:#93c5fd;word-break:break-word}.term{color:#bbf7d0}.error{color:#fca5a5;font-size:.9rem}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a{padding:7px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none}</style></head><body><main><h1>Vagas Olímpicas 2027</h1><p class="subtitle">Monitoramento de editais para medalhistas de olimpíadas do conhecimento.</p><p class="updated" id="updated">Carregando última atualização…</p><section class="grid" id="cards" aria-live="polite"></section></main><script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cards=document.querySelector('#cards'),updated=document.querySelector('#updated');
fetch(`status.json?cache=${Date.now()}`).then(r=>{if(!r.ok)throw Error('status.json indisponível');return r.json()}).then(data=>{updated.textContent=data.ultima_atualizacao?`Última atualização: ${new Date(data.ultima_atualizacao).toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'long'})}`:'Aguardando a primeira execução do monitor.';cards.innerHTML=data.universidades.map(site=>{const detected=site.status==='Novidade Detectada';const links=[site.edital_url&&`<a href="${esc(site.edital_url)}" target="_blank" rel="noopener">Edital</a>`,site.inscricao_url&&`<a href="${esc(site.inscricao_url)}" target="_blank" rel="noopener">Inscrição</a>`].filter(Boolean).join('');return `<article class="card"><h2>${esc(site.universidade)}</h2><span class="badge ${detected?'new':'waiting'}">${detected?'NOVIDADE DETECTADA':'AGUARDANDO EDITAL 2027'}</span><p><a href="${esc(site.url)}" target="_blank" rel="noopener">Fonte oficial</a></p><p class="forecast"><strong>Base indicativa:</strong> ${esc(site.previsao)}</p>${links?`<p class="actions">${links}</p>`:''}${site.termo_identificado?`<p class="term">Termo: “${esc(site.termo_identificado)}”</p>`:''}${site.erro?`<p class="error">${esc(site.erro)}</p>`:''}</article>`}).join('')}).catch(error=>{updated.textContent=error.message;cards.innerHTML='<p class="error">Não foi possível carregar os dados.</p>'});
</script></body></html>
